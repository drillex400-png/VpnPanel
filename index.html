<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PanelVPN — Управление серверами</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <!-- Note: this used to be "className" (a JSX-only attribute browsers silently ignore on a
       plain HTML tag) so none of the old styling here was ever actually applied -- the real
       background/selection colors always came from src/index.css. Fixed to the real "class"
       attribute and updated to the current violet/fuchsia theme so there's no mismatch/FOUC
       flash before the stylesheet loads, and to stop shipping the old emerald/near-black values
       as dead-but-misleading markup. -->
  <body class="bg-[#0a0712] text-slate-100 antialiased selection:bg-violet-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
